<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Yejarafe</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yejarafe">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#667085;--line:#e3e6ea;
  --brand:#1f6feb;--brand-ink:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--info:#7c3aed;
  --court:#e8894a;--court-line:#fff;--net:#222;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa3b2;--line:#2a2f38;
  --brand:#4c8dff;--brand-ink:#fff;--court:#b8642f;--court-line:#f4e9df;--net:#eee;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa3b2;--line:#2a2f38;
  --brand:#4c8dff;--brand-ink:#fff;--court:#b8642f;--court-line:#f4e9df;--net:#eee;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:1.15rem;flex:1}
#syncDot{font-size:.75rem;opacity:.9;cursor:pointer}
main{padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 10px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button span{font-size:1.35rem;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:1.1rem;margin:4px 0 12px}
h3{font-size:1rem;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{resize:vertical}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:.85rem}
.muted{color:var(--muted);font-size:.88rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.click{cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--line)}
.av.big{width:84px;height:84px;border-width:3px}
.ptag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;color:var(--pc);border:1px solid var(--pc);background:color-mix(in srgb,var(--pc) 12%,transparent)}
.pos-h{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-weight:700;color:var(--pc)}.pos-h:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.phys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;flex:none}
.pill{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);display:inline-block}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.att{display:flex;gap:4px}
.att button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;width:38px;height:36px;font-weight:700;cursor:pointer}
.att button.on.P{background:var(--ok);color:#fff;border-color:var(--ok)}
.att button.on.A{background:var(--bad);color:#fff;border-color:var(--bad)}
.att button.on.T{background:var(--warn);color:#fff;border-color:var(--warn)}
.att button.on.J{background:var(--info);color:#fff;border-color:var(--info)}
.att.stat button{width:auto;min-width:46px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:var(--text)}
.att.stat small{font-size:.62rem;font-weight:600;color:var(--muted)}
.st.A{border-color:#1f6feb}.st.B{border-color:#7c3aed}.st.S{border-color:#16a34a}.st.E{border-color:var(--bad)}
.att button:active{transform:scale(.94)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.vid{display:flex;gap:10px;align-items:center}
.thumb{width:110px;aspect-ratio:16/9;border-radius:8px;background:#000 center/cover;flex:none;display:grid;place-items:center;color:#fff;font-size:1.6rem;cursor:pointer}
.player-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin-top:10px}
.player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.court-wrap{max-width:420px;margin:0 auto}
.net{height:8px;background:repeating-linear-gradient(90deg,var(--net) 0 6px,transparent 6px 10px);border-radius:3px;margin-bottom:4px}
.court{position:relative;background:var(--court);border:3px solid var(--court-line);border-radius:6px;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 2fr}
.court:before{content:"";position:absolute;left:0;right:0;top:33.33%;border-top:2px solid var(--court-line)}
.slot{display:grid;place-items:center;padding:6px;z-index:1}
.slot button{width:100%;max-width:110px;aspect-ratio:1/1;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.25);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;padding:4px}
.slot button.sel{outline:4px solid #ffd60a}
.slot button.serve{border-color:#ffd60a}
.slot b{font-size:1.4rem;line-height:1}
.slot small{font-size:.7rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .pos{font-size:.65rem;opacity:.85}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--text);width:min(92vw,440px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--text);padding:9px 4px;font:inherit;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
summary{cursor:pointer}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{padding:7px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl tr.low td{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:left;font:inherit;color:var(--text);cursor:pointer}
.tile span{font-size:1.6rem;display:block;margin-bottom:6px}
.tile b{display:block}.tile small{color:var(--muted)}
.score{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:800;font-size:2.4rem;margin:6px 0}
.score small{display:block;font-size:.7rem;font-weight:600;color:var(--muted);text-align:center}
.score .sep{color:var(--muted);font-size:1.6rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.25rem}.kpi small{color:var(--muted);font-size:.75rem}
.note{white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.si{background:var(--ok);color:#fff;border-color:var(--ok)}.chip.no{background:var(--bad);color:#fff;border-color:var(--bad)}.chip.duda{background:var(--warn);color:#fff;border-color:var(--warn)}
.money-in{color:var(--ok)}.money-out{color:var(--bad)}
code{font-size:.85em;background:var(--bg);padding:1px 4px;border-radius:4px}
/* ===== Diseño v2: más atractivo y adaptado a móvil, tablet y ordenador ===== */
:root{--bg:#eef2f8;--card:#fff;--line:#e4e9f1;--brand:#1d5bd8;--brand2:#0b1f44;--accent:#ffc23d;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);--r:18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f17;--card:#141a25;--line:#243042;--brand:#4c8dff;--brand2:#060a12;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b0f17;--card:#141a25;--line:#243042;--brand:#4c8dff;--brand2:#060a12;--shadow:0 1px 2px rgba(0,0,0,.4)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,a,.click,.tile,summary,label.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
header{background:linear-gradient(135deg,var(--brand2) 0%,var(--brand) 100%);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));box-shadow:0 2px 12px rgba(11,31,68,.25)}
header h1{font-size:1.12rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
header h1 img{width:30px;height:30px;border-radius:9px;background:#fff;object-fit:contain;padding:2px}
header h1 small{display:block;font-size:.72rem;font-weight:500;opacity:.8;letter-spacing:0}
#syncDot{background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px}
main{padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.card{border:1px solid transparent;border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{border-color:var(--line)}}
:root[data-theme="dark"] .card{border-color:var(--line)}
h2{font-weight:800;letter-spacing:-.01em}
.btn{border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.08);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.05)}
.btn:not(.sec):not(.danger){background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 88%,#fff),var(--brand))}
input,select,textarea{border-radius:12px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:0;border-color:var(--brand)}
nav.tabs{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
nav.tabs button{position:relative;padding:8px 2px 9px;font-weight:600}
nav.tabs button span{display:grid;place-items:center;width:46px;height:28px;border-radius:99px;transition:background .2s}
nav.tabs button.on span{background:color-mix(in srgb,var(--brand) 16%,transparent)}
.tiles{gap:12px}
.tile{border:1px solid transparent;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 14px;transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.45rem;margin-bottom:10px;background:color-mix(in srgb,var(--tc,var(--brand)) 15%,transparent)}
.tiles .tile:nth-child(8n+1){--tc:#1d5bd8}.tiles .tile:nth-child(8n+2){--tc:#f59e0b}.tiles .tile:nth-child(8n+3){--tc:#dc2626}.tiles .tile:nth-child(8n+4){--tc:#16a34a}
.tiles .tile:nth-child(8n+5){--tc:#7c3aed}.tiles .tile:nth-child(8n+6){--tc:#0891b2}.tiles .tile:nth-child(8n+7){--tc:#db2777}.tiles .tile:nth-child(8n+8){--tc:#475569}
.kpi{border:1px solid transparent;border-radius:14px;box-shadow:var(--shadow)}
.kpi b{font-size:1.45rem;font-weight:800;color:var(--brand)}
.seg{border-radius:12px;padding:3px;background:var(--bg);gap:3px;border-color:transparent}
.seg button{border-radius:9px;background:transparent;font-weight:600;font-size:.92rem}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.hero{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border:0}
.hero .muted,.hero .pill{color:rgba(255,255,255,.85)}.hero .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.hero .pill.ok{color:#bbf7d0}.hero .pill.bad{color:#fecaca}.hero .pill.warn{color:#fde68a}
.hero h2{color:#fff}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
dialog{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100dvh - 40px);overflow:auto}
.toast{bottom:calc(96px + env(safe-area-inset-bottom));border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.install{display:flex;gap:12px;align-items:center}
#syncDot:empty{display:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{border:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 2px 10px;font:inherit;font-size:.78rem;font-weight:700;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-bottom:3px solid var(--brand)}
.quick button span{font-size:1.5rem}
#app.dash>.quick{display:grid}
.exgrid{display:grid;grid-template-columns:1fr;gap:10px}
.excard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:10px;font:inherit;color:var(--text);cursor:pointer}
.exthumb{width:96px;height:72px;flex:none;border-radius:12px;background:#111 center/cover no-repeat;display:grid;place-items:center;color:#fff;font-size:1.6rem;overflow:hidden;position:relative}
.exthumb span{background:rgba(177,44,36,.9);border-radius:99px;width:34px;height:34px;display:grid;place-items:center;font-size:.9rem}
.exthumb.empty{background:color-mix(in srgb,var(--brand) 12%,var(--bg))}.exthumb.board{background:#2b6b4f;align-items:start}.exthumb.board svg{width:62px!important;margin-top:-4px}
.exbody b{display:block;font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:1.12rem;line-height:1.1}.exbody small{display:block;color:var(--muted);margin:3px 0}.exicons{font-size:.78rem;color:var(--muted)}
.exboard{max-width:340px;margin:0 auto}
.exphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.exphotos button{aspect-ratio:1;border:0;border-radius:10px;background:#ddd center/cover;cursor:pointer}
nav.tabs button{font-size:.66rem}
@media (min-width:700px){.exgrid{grid-template-columns:1fr 1fr}.exphotos{grid-template-columns:repeat(4,1fr)}nav.tabs button{font-size:.75rem}}
@media (min-width:1000px){.exgrid{grid-template-columns:1fr 1fr 1fr}nav.tabs button{font-size:.95rem}}

.tacnav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tacnav button{border:0;background:var(--card);color:var(--muted);border-radius:14px;padding:8px 2px;font:inherit;font-size:.78rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);cursor:pointer}
.tacnav button span{font-size:1.25rem}.tacnav button.on{background:var(--brand);color:#fff}
.rotstep{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px;background:var(--bg);border-radius:14px;padding:4px}
.rotstep button{width:48px;height:44px;border:0;border-radius:11px;background:var(--card);color:var(--text);font-size:1.6rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.rotstep div{text-align:center}.rotstep b{display:block;font-size:1.15rem}.rotstep small{color:var(--muted);font-size:.78rem}
.toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.toolbar button,.itemgrid button{border:0;background:transparent;color:var(--text);border-radius:9px;padding:6px 2px;font:inherit;font-size:.7rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.toolbar button span,.itemgrid button span{font-size:1.15rem;line-height:1.2}
.toolbar button.on,.itemgrid button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.15)}
.itemgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;background:var(--bg);border-radius:12px;padding:4px}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.steps button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.court-card{margin:0 0 12px}
.note-step{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-left:4px solid var(--accent)}
.libgrid{display:grid;grid-template-columns:1fr;gap:10px}
.libcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:10px;font:inherit;color:var(--text);cursor:pointer}
.libcard .mini{width:74px;flex:none;border-radius:10px;pointer-events:none}.libcard b{display:block}.libcard small{display:block;color:var(--muted);margin:2px 0 6px;font-size:.82rem}
@media (min-width:700px){.libgrid{grid-template-columns:1fr 1fr}.tacnav{max-width:560px}}
@media (min-width:1000px){.libgrid{grid-template-columns:1fr 1fr 1fr}}

.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
/* modo acta */
.acta{background:var(--bg);border-radius:14px;padding:10px;margin:0 0 12px}
.empty-acta p{margin:4px 0 10px}
.acta-head{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.minicourt,.lineup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative;padding-top:20px}
.minicourt .net,.lineup-grid .net{position:absolute;top:0;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#111 0 6px,#fff 6px 9px);color:transparent;border-radius:3px;font-size:0}

const KEY="voleibol-app-v1", SKEY="voleibol-sync-v1";
const POS=["Colocador","Opuesto","Receptor","Central","Líbero","Otro"];
const ATT={P:"Presente",A:"Ausente",T:"Tarde",J:"Justificado"};

let rotTab="sys";
const POSC={Colocador:"#f59e0b",Opuesto:"#dc2626",Receptor:"#1f6feb",Central:"#16a34a","Líbero":"#7c3aed",Otro:"#64748b"};

const pc=pos=>POSC[pos]||POSC.Otro;
const posTag=pos=>`<span class="ptag" style="--pc:${pc(pos)}">${esc(pos||"Otro")}</span>`;
function age(b){if(!b)return null;const d=new Date(b+"T12:00"),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return isNaN(a)?null:a}
const physLine=p=>[age(p.birth)!=null?age(p.birth)+" años":"",p.height?p.height+" cm":"",p.weight?p.weight+" kg":""].filter(Boolean).join(" · ");

const CATS=["Sénior","Júnior","Juvenil","Cadete","Infantil","Alevín","Benjamín","Aficionados","Veteranos"];
const GENS=["Femenino","Masculino","Mixto"];
const SCOPED=["players","sessions","videos","notes","fees","money","lineups","tests"];
const TKEY="voleibol-team";
let root=load(),VW={},curT=null;
function ensureTeams(){if(!Array.isArray(root.teams)||!root.teams.length)root.teams=[{id:"t0",cat:"",gen:"",sub:"",lineup:root.lineup}];
  if(!curT){try{curT=localStorage.getItem(TKEY)}catch(e){}}if(!root.teams.some(t=>t.id===curT))curT=root.teams[0].id}
function curTeam(){return root.teams.find(t=>t.id===curT)||root.teams[0]}
const tmOf=x=>x.tm||root.teams[0].id;
function flush(){Object.keys(VW).forEach(k=>{VW[k].forEach(x=>{if(!x.tm)x.tm=curT});root[k]=(root[k]||[]).filter(x=>tmOf(x)!==curT).concat(VW[k])})}
function setRoot(x){root=x;VW={};ensureTeams()}
function raw(){flush();return root}
const db=new Proxy({},{
  get(_,k){if(k==="toJSON")return ()=>raw();if(SCOPED.includes(k))return VW[k]||(VW[k]=(root[k]||[]).filter(x=>tmOf(x)===curT));
    if(k==="lineup"){const t=curTeam();return t.lineup||(t.lineup={slots:[null,null,null,null,null,null],libero:null,rot:1})}return root[k]},
  set(_,k,v){if(SCOPED.includes(k))VW[k]=v;else if(k==="lineup")curTeam().lineup=v;else root[k]=v;return true},
  has(_,k){return k in root},ownKeys(){return Reflect.ownKeys(root)},getOwnPropertyDescriptor(_,k){return {value:root[k],enumerable:true,configurable:true,writable:true}}});
ensureTeams();
function fedGuess(L){const n=L.name||"";return {cat:CATS.find(c=>norm(n).includes(norm(c)))||"",gen:/femenin/i.test(n)?"Femenino":/masculin/i.test(n)?"Masculino":/mixt/i.test(n)?"Mixto":""}}
function autoSplit(){if(root.teams.length!==1||root.noSplit)return false;const ps=(root.players||[]).filter(p=>p.fed);if(ps.length<2)return false;
  const own={};(root.leagues||[]).forEach(L=>L.teams.forEach(t=>{if(t.mine)(t.players||[]).forEach(fp=>own[fp.id]={L,t})}));
  const G=new Map();ps.forEach(p=>{const o=own[p.fed];if(!o)return;if(!G.has(o.t.id))G.set(o.t.id,{o,ps:[]});G.get(o.t.id).ps.push(p)});
  if(G.size<2)return false;flush();const t0=root.teams[0];const rest=(root.players||[]).filter(p=>!p.fed||!own[p.fed]).length;
  const groups=[...G.values()].sort((a,b)=>b.ps.length-a.ps.length);
  groups.forEach((g,i)=>{const gg=fedGuess(g.o.L);let t;
    if(i===0&&!rest&&!t0.cat){t=t0;Object.assign(t,{cat:gg.cat||"Sénior",gen:gg.gen,sub:"",fed:g.o.t.id})}
    else{t={id:"tf"+g.o.t.id,cat:gg.cat||"Sénior",gen:gg.gen,sub:"",fed:g.o.t.id};root.teams.push(t)}
    g.ps.forEach(p=>p.tm=t.id)});
  VW={};return true}
const clubCase=n=>titleCase(n).replace(/\b(Cv|Cd|Ud|Ad|Ies|Cdv)\b/g,m=>m.toUpperCase());
function teamLeague(){const fed=curTeam().fed;if(!fed)return null;for(const L of (db.leagues||[])){const t=L.teams.find(x=>x.id===fed);if(t)return {L,t}}return null}
function teamOverview(){const t=curTeam();const TL=teamLeague();const n=db.players.length;const who=t.gen==="Masculino"?"jugadores":"jugadoras";

   ${TL?"":`<p class="muted" style="margin-bottom:0">Toca “Cambiar” y el lápiz de este equipo para elegir su categoría y su equipo de la federación: así verás aquí su liga y sus rivales.</p>`}</div>`}
function rivalsCard(){const TL=teamLeague();if(!TL)return "";const {L,t}=TL;const st=standings(L);if(st.length<2)return "";
  const nx=L.matches.filter(m=>(m.home===t.id||m.away===t.id)&&!setsOf(m)&&!m.postponed&&m.date>=today()).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))[0];const nid=nx?(nx.home===t.id?nx.away:nx.home):null;
  const h2h=id=>{const ms=L.matches.filter(m=>setsOf(m)&&((m.home===t.id&&m.away===id)||(m.away===t.id&&m.home===id)));return ms.map(m=>{const r=setsOf(m);const mine=m.home===t.id?r.h:r.a,th=m.home===t.id?r.a:r.h;return `<span class="pill ${mine>th?"ok":"bad"}">${mine}-${th}</span>`}).join(" ")};
  return `<div class="card"><h3 style="margin-top:0">🏆 Clasificación y rivales</h3><table class="tbl rivtbl" style="width:100%"><tr><th></th><th style="text-align:left">Equipo</th><th>Pts</th><th>G-P</th><th>Vs</th></tr>
   ${st.map((r,i)=>`<tr class="${r.t.id===t.id?"me":"click"}" ${r.t.id===t.id?"":`onclick="tab='leagues';selLeague='${L.id}';selTeam='${r.t.id}';render();scrollTo(0,0)"`}><td>${i+1}</td><td style="text-align:left"><span class="rivn">${crest(r.t,20)}<span>${esc(clubCase(r.t.name))}${r.t.id===nid?` <span class="pill warn">próximo</span>`:""}</span></span></td><td><b>${r.pts}</b></td><td>${r.pg}-${r.pp}</td><td>${r.t.id===t.id?"":h2h(r.t.id)}</td></tr>`).join("")}</table>
   <p class="muted" style="margin-bottom:0">Toca un rival para ver su plantilla y sus partidos. “Vs” son vuestros resultados contra él esta temporada.</p></div>`}

function actaLineup(sid,n){const s=sess(sid);s.acta=s.acta||{};const prev=s.acta[n]||s.acta[n-1]||null;const def=prev?prev.lineup:db.lineup.slots;

function actaSub(sid){const s=sess(sid);const n=s.set||1;const st=actaState(s,n);if(!st)return;

function findRival(name){const n=norm(name||"");if(n.length<3)return null;let best=null,score=0;
  (db.leagues||[]).forEach(L=>L.teams.forEach(t=>{if(t.mine)return;const tn=norm(t.name);let sc=0;
    if(tn===n)sc=100;else if(tn.includes(n)||n.includes(tn))sc=60;else{const a=n.split(" ").filter(w=>w.length>2&&!["club","voleibol","cv","cd","ud"].includes(w));const hit=a.filter(w=>tn.split(" ").includes(w)).length;if(hit)sc=hit*20}
    if(sc>score){score=sc;best={L,t}}}));return score>=20?best:null}

     ${r?`<div class="kpis"><div class="kpi"><b>${pos+1}º</b><small>posición</small></div><div class="kpi"><b>${r.pts}</b><small>puntos</small></div><div class="kpi"><b>${r.pg}-${r.pp}</b><small>G-P</small></div><div class="kpi"><b>${r.sf}-${r.sc}</b><small>sets</small></div></div>`:""}

     ${h2h.length?`<h4 style="margin:12px 0 4px">Contra nosotros esta temporada</h4><ul class="list">${h2h.map(m=>matchLi(L,m,me.id)).join("")}</ul>`:""}

/* ---------- ROTACIONES TEMPORADA, SIDE-OUT, CUMPLEAÑOS, INFORME ---------- */
function setterIdx(lu){const i=lu.findIndex(id=>/coloc/i.test((player(id)||{}).pos||""));return i}
function rallyStats(sessions){const R={},T={so:0,soN:0,bp:0,bpN:0,n:0};let bySetter=false;
  sessions.forEach(s=>Object.keys(s.acta||{}).forEach(n=>{const st=actaState(s,+n);if(!st)return;st.rallies.forEach(r=>{T.n++;
    if(r.srv==="them"){T.soN++;if(r.w==="us")T.so++}else{T.bpN++;if(r.w==="us")T.bp++}
    const si=setterIdx(r.lu);const key=si>=0?"S"+(si+1):"R"+(r.rot+1);if(si>=0)bySetter=true;
    const x=R[key]=R[key]||{won:0,lost:0,so:0,soN:0,bp:0,bpN:0};if(r.w==="us")x.won++;else x.lost++;if(r.srv==="them"){x.soN++;if(r.w==="us")x.so++}else{x.bpN++;if(r.w==="us")x.bp++}})}));
  return {R,T,bySetter}}
const pctx=(a,b)=>b?Math.round(a*100/b)+"%":"–";
function rotSeasonCard(){const ms=db.sessions.filter(s=>s.type==="partido"&&s.acta&&Object.keys(s.acta).length);
  if(!ms.length)return `<div class="card"><h2>🔄 Rendimiento por rotación</h2><p class="muted" style="margin:0">Usa el <b>modo acta</b> en los partidos (poner la rotación inicial) y aquí verás en qué rotación ganáis y perdéis más puntos, y vuestro side-out y break-point.</p></div>`;
  const {R,T,bySetter}=rallyStats(ms);const keys=Object.keys(R).sort();const worst=keys.slice().sort((a,b)=>(R[a].won-R[a].lost)-(R[b].won-R[b].lost))[0];
  const label=k=>k[0]==="S"?"Colocadora en "+ROMAN[+k.slice(1)-1]:"Rotación "+k.slice(1);
  return `<div class="card"><h2>🔄 Rendimiento por rotación</h2>
   <div class="kpis"><div class="kpi"><b>${pctx(T.so,T.soN)}</b><small>side-out<br>(saca el rival)</small></div><div class="kpi"><b>${pctx(T.bp,T.bpN)}</b><small>break-point<br>(sacamos)</small></div><div class="kpi"><b>${T.n}</b><small>jugadas</small></div></div>
   <table class="tbl" style="width:100%;margin-top:10px"><tr><th style="text-align:left">${bySetter?"Rotación":"Rotación"}</th><th>+/-</th><th>Side-out</th><th>Break</th></tr>
   ${keys.map(k=>{const x=R[k],d=x.won-x.lost;return `<tr ${k===worst&&d<0?'style="background:color-mix(in srgb,var(--brand) 12%,transparent)"':""}><td style="text-align:left">${label(k)}</td><td class="${d<0?"neg":"posv"}">${d>0?"+":""}${d}</td><td>${pctx(x.so,x.soN)}</td><td>${pctx(x.bp,x.bpN)}</td></tr>`}).join("")}</table>
   <p class="muted">${bySetter?"Las rotaciones se nombran por dónde está la colocadora (I = sacando), como en los equipos de liga. ":"Pon la posición “Colocador” en la ficha de tu colocadora y las rotaciones se nombrarán por dónde está ella, como en los equipos de liga. "}<b>Side-out</b>: % de puntos que ganáis cuando saca el rival (bueno a partir del 55-60%). <b>Break-point</b>: % que ganáis con vuestro saque (bueno a partir del 40%).${worst&&R[worst].won<R[worst].lost?` La rotación que más sufre es <b>${label(worst)}</b>: dedícale tiempo en el entreno.`:""}</p></div>`}
function birthdaysCard(){const t=new Date();t.setHours(0,0,0,0);const list=db.players.filter(p=>p.birth).map(p=>{const b=new Date(p.birth+"T12:00");let d=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(d<t)d=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());const days=Math.round((d-t)/864e5);return {p,days,age:d.getFullYear()-b.getFullYear(),d}}).filter(x=>x.days<=14).sort((a,b)=>a.days-b.days);
  if(!list.length)return "";const wa=p=>{const g=(p.phone||"").replace(/\D/g,"");return g?`https://wa.me/${/^[67]\d{8}$/.test(g)?"34"+g:g}?text=${encodeURIComponent("¡Feliz cumpleaños, "+p.name.split(" ")[0]+"! 🎂🏐 De parte de todo el "+db.team+" ❤️🖤")}`:""};
  return `<div class="card"><h3>🎂 Cumpleaños</h3><ul class="list">${list.map(x=>`<li>${avatar(x.p)}<div class="grow"><b>${esc(x.p.name)}</b><div class="muted">${x.days===0?"¡Hoy! ":x.days===1?"Mañana · ":"En "+x.days+" días · "}cumple ${x.age}</div></div>${wa(x.p)?`<a class="btn sec small" target="_blank" rel="noopener" href="${wa(x.p)}">💬 Felicitar</a>`:""}</li>`).join("")}</ul></div>`}
function playerReport(p){const {rows}=seasonRows();const r=rows.find(x=>x.p.id===p.id)||{};const L=[`🏐 *${db.team} · Informe de ${p.name.split(" ")[0]}*`,`📅 ${fmtDate(today())}`,"",`✅ Asistencia: ${pct(p.id)}%`];
  if(r.pj)L.push(`🏆 Partidos jugados: ${r.pj}`,`⭐ Puntos: ${r.pts} (ataque ${r.A}, bloqueo ${r.B}, saque ${r.S}) · ${(r.pts/r.pj).toFixed(1)} por partido`,`⚠️ Errores: ${r.E}`);
  if(r.rec!=null)L.push(`🙌 Recepción media: ${r.rec} / 3`);if(r.srv!=null)L.push(`🎯 Saque medio: ${r.srv} / 3`);
  const tl=TESTS.map(t=>{const x=testsOf(p.id,t.k);if(!x.length)return null;const last=x[x.length-1],first=x[0];const d=x.length>1?+(last.v-first.v).toFixed(1):0;return `• ${t.n}: ${last.v} ${t.u}${d?` (${d>0?"+":""}${d} desde ${fmtDate(first.date)})`:""}`}).filter(Boolean);
  const pt=playerPT(p);if(pt)L.push(`⏱️ Sets jugados: ${pt.sets} (titular en ${pt.starts}) · ${pt.pc}% de los puntos en pista`);
  if(tl.length)L.push("","💪 *Pruebas físicas*",...tl);
  const gs=(p.goals||[]);if(gs.length)L.push("","🎯 *Objetivos*",...gs.map(g=>`${g.done?"✅":"⬜"} ${g.text}${!g.done&&g.due?" (hasta "+fmtDate(g.due)+")":""}`));L.push("","¡Sigue así! "+(db.slogan||"Más que un equipo, una familia")+" ❤️🖤");return L.join("\n")}
function sendReport(id){const p=player(id);const g=(p.phone||"").replace(/\D/g,"");const url=`https://wa.me/${g?(/^[67]\d{8}$/.test(g)?"34"+g:g):""}?text=${encodeURIComponent(playerReport(p))}`;window.open(url,"_blank","noopener")}

/* ---------- TIEMPO DE JUEGO ---------- */
function playTime(){const ms=db.sessions.filter(s=>s.type==="partido"&&s.acta&&Object.keys(s.acta).length);const P={};let total=0,sets=0;
  const g=id=>P[id]=P[id]||{sets:0,pts:0,starts:0,ms:new Set()};
  ms.forEach(s=>Object.keys(s.acta).forEach(n=>{const st=actaState(s,+n);if(!st)return;sets++;total+=st.rallies.length;const on=new Set(st.A.lineup.filter(Boolean));st.A.lineup.forEach(id=>{if(id)g(id).starts++});st.subs.forEach(x=>on.add(x.in));if(st.A.libero)on.add(st.A.libero);
    on.forEach(id=>{const x=g(id);x.sets++;x.ms.add(s.id)});st.rallies.forEach(r=>r.lu.forEach(id=>{if(id)g(id).pts++}))}));
  return {ms,P,total,sets}}
function playTimeCard(){const {ms,P,total,sets}=playTime();
  if(!ms.length)return `<div class="card"><h2>⏱️ Tiempo de juego</h2><p class="muted" style="margin:0">Con el <b>modo acta</b> (rotación inicial y cambios) aquí verás cuántos sets y puntos juega cada una, para repartir minutos con justicia.</p></div>`;
  const rows=sortedPlayers().map(p=>({p,x:P[p.id]||{sets:0,pts:0,starts:0,ms:new Set()}})).sort((a,b)=>b.x.pts-a.x.pts||b.x.sets-a.x.sets);
  const conv=p=>ms.filter(s=>present(s,p.id)||s.rsvp?.[p.id]==="si").length;
  const low=rows.filter(r=>conv(r.p)&&total&&r.x.pts/total<.15&&r.p.pos!=="Líbero");
  return `<div class="card"><h2>⏱️ Tiempo de juego</h2><p class="muted" style="margin-top:0">${ms.length} partido${ms.length>1?"s":""} con acta · ${sets} sets · ${total} puntos jugados</p>
   <table class="tbl ptime" style="width:100%"><tr><th style="text-align:left">Jugadora</th><th>Sets</th><th>Titular</th><th>En pista</th></tr>
   ${rows.map(({p,x})=>{const pc=total?Math.round(x.pts*100/total):0;return `<tr><td style="text-align:left">${esc(p.number?p.number+" ":"")}${esc(p.name)}${injured(p)?" 🩹":""}</td><td>${x.sets}</td><td>${x.starts}</td><td><div class="ptbar"><i style="width:${pc}%"></i><span>${p.pos==="Líbero"&&!x.pts&&x.sets?"líbero":pc+"%"}</span></div></td></tr>`}).join("")}</table>
   ${low.length?`<p class="warntxt">Juegan poco: <b>${low.map(r=>esc(r.p.name.split(" ")[0])).join(", ")}</b> (menos del 15% de los puntos aunque vienen). Si es lo que quieres, perfecto; si no, busca sets o finales de set para darles minutos.</p>`:""}
   <p class="muted">“En pista” es el % de puntos que ha estado en el campo. A la líbero no se le cuentan puntos porque entra y sale sin cambio oficial.</p></div>`}
function playerPT(p){const {P,total}=playTime();const x=P[p.id];if(!x||!total)return null;return {sets:x.sets,starts:x.starts,pc:Math.round(x.pts*100/total),ms:x.ms.size}}

function goalsCard(p){const G=(p.goals||[]).slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.due||"9").localeCompare(b.due||"9"));
  return `<div class="card"><h3>🎯 Objetivos</h3>
   ${G.length?`<ul class="list goals">${G.map(g=>{const late=!g.done&&g.due&&g.due<today();return `<li><label class="grow goal ${g.done?"done":""}"><input type="checkbox" ${g.done?"checked":""} onchange="goalToggle('${p.id}','${g.id}')"> <span>${esc(g.text)}${g.due?`<small class="muted ${late?"neg":""}"> · ${late?"vencido ":"hasta "}${fmtDate(g.due)}</small>`:""}</span></label><button class="btn sec small" aria-label="Quitar" onclick="goalDel('${p.id}','${g.id}')">✕</button></li>`}).join("")}</ul>`:`<p class="muted" style="margin-top:0">Pon 1–3 objetivos concretos con ella (por ejemplo “Recepción media de 2 en partido” o “Saque flotante: 8 de 10 dentro”). Salen en su informe de WhatsApp.</p>`}
   <form style="margin-top:8px" onsubmit="goalAdd(event,'${p.id}')"><input name="t" placeholder="Nuevo objetivo" required maxlength="120"><div class="row" style="margin-top:8px;align-items:center"><span class="muted">Hasta</span><input name="d" type="date" class="grow" style="width:auto" title="Fecha límite (opcional)"><button class="btn small">Añadir</button></div></form></div>`}
function goalAdd(e,pid){e.preventDefault();const f=e.target,p=player(pid);p.goals=p.goals||[];p.goals.push({id:uid(),text:f.t.value.trim(),due:f.d.value||"",done:false,at:Date.now()});save();render()}
function goalToggle(pid,id){const g=(player(pid).goals||[]).find(x=>x.id===id);if(!g)return;g.done=!g.done;g.at=Date.now();save();render();if(g.done)toast("🎉 ¡Objetivo cumplido!")}
function goalDel(pid,id){const p=player(pid);p.goals=(p.goals||[]).filter(x=>x.id!==id);save();render()}

function weekSessions(){const end=addDays(today(),7);return db.sessions.filter(s=>s.date>=today()&&s.date<=end).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))}
function weekText(){const ws=weekSessions();const L=[`🏐 *${db.team} · Esta semana*`,""];

  L.push("",(db.slogan||"Más que un equipo, una familia")+" ❤️🖤");return L.join("\n")}
function weekCard(){const ws=weekSessions();if(!db.players.length)return "";

/* ---------- IMPORTAR PLANTILLA DE LA FEDERACIÓN ---------- */
function titleCase(n){return String(n||"").toLowerCase().replace(/(^|[\s\-'])([a-záéíóúñü])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Del|La|Las|Los|Y)\b/g,w=>w.toLowerCase()).replace(/^./,c=>c.toUpperCase())}
function fedTeams(){const out=[];(db.leagues||[]).forEach(L=>L.teams.forEach(t=>{if(t.mine&&(t.players||[]).length)out.push({L,t})}));return out}
function importFed(){const T=fedTeams();const d=$("#dlg");
  if(!T.length){toast("Aún no hay plantillas de la federación. Abre Más › Ligas para que se descarguen.");return}
  const hasDemo=db.players.some(p=>p.demo);
  d.innerHTML=`<form method="dialog" id="imf"><h3>⬇️ Importar de la federación</h3><p class="muted" style="margin-top:0">Se añaden los nombres de la ficha federativa. Después pon dorsal y posición a cada uno. Solo se importan nombres.</p>
   ${T.map(({L,t},i)=>`<label class="radio"><input type="radio" name="t" value="${i}" ${i?"":"checked"}> <b>${esc(t.name)}</b> <span class="muted">· ${esc(L.name)} · ${t.players.length} jugadores</span></label>`).join("")}
   ${hasDemo?`<label class="radio"><input type="checkbox" name="demo" checked> Quitar antes los datos de ejemplo</label>`:""}
   <div class="row" style="margin-top:14px;justify-content:flex-end"><button value="cancel" class="btn sec">Cancelar</button><button value="ok" class="btn">Importar</button></div></form>`;
  d.showModal();d.onclose=()=>{if(d.returnValue!=="ok")return;const f=$("#imf");const {t}=T[+f.querySelector("input[name=t]:checked").value];
    if(f.demo&&f.demo.checked){["players","sessions","notes","fees","tests"].forEach(k=>db[k]=(db[k]||[]).filter(x=>!x.demo));try{localStorage.setItem("voleibol-seeded","1")}catch(e){}}
    const have=new Set(db.players.map(p=>norm(p.name)));let n=0;
    t.players.forEach(fp=>{const name=titleCase(fp.name);if(have.has(norm(name)))return;db.players.push({id:uid(),name,number:fp.num||"",pos:fp.pos&&POS.includes(fp.pos)?fp.pos:"Otro",phone:"",fed:fp.id});have.add(norm(name));n++});
    curTeam().fed=t.id;save();render();toast(n?`${n} jugadores importados. Pon dorsal y posición a cada uno.`:"Ya estaban todos en la plantilla")}}

/* ---------- CARGA Y BIENESTAR ---------- */
const WQ=[["rpe","💥 Dureza del entreno","1 = muy suave · 10 = máximo esfuerzo"],["fat","😮‍💨 Cansancio","1 = fresca · 10 = agotada"],["sleep","😴 Sueño de anoche","1 = fatal · 10 = genial"],["pain","🤕 Dolor o molestias","1 = nada · 10 = mucho"]];
function sessMin(s){const p=(s.plan||[]).map(id=>db.exercises.find(e=>e.id===id)).filter(Boolean).reduce((n,e)=>n+(+e.mins||0),0);return +s.dur||p||90}
function wellAlert(w){return w&&(w.pain>=7||w.fat>=8||w.sleep<=3)}
function weekKey(d){const x=new Date(d+"T12:00");const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}
function loadOf(pid){const W={};db.sessions.forEach(s=>{const w=(s.well||{})[pid];if(!w)return;const k=weekKey(s.date);W[k]=(W[k]||0)+w.rpe*sessMin(s)});return W}
function acwr(pid){const W=loadOf(pid);const cur=W[weekKey(today())]||0;const prev=[1,2,3,4].map(i=>{const d=new Date(weekKey(today())+"T12:00");d.setDate(d.getDate()-7*i);return W[d.toISOString().slice(0,10)]||0});const ch=prev.reduce((a,b)=>a+b,0)/4;return {cur,ch,r:ch?cur/ch:null,W}}
function wellLink(s){return appUrl()+"?w="+s.id+"&s="+encodeURIComponent(sync.url)}
function wellCard(s){s.well=s.well||{};const ps=sortedPlayers().filter(p=>present(s,p.id)||s.well[p.id]);const got=Object.keys(s.well).length;const min=sessMin(s);
  return `<details class="card" ${got?"open":""}><summary><b>💪 Carga y bienestar</b> <span class="pill">${got}/${ps.length||db.players.length}</span></summary>
   <p class="muted">Después del ${s.type==="partido"?"partido":"entreno"}, cada jugadora dice lo duro que fue y cómo está. Carga = dureza × minutos (${min} min${s.dur?"":` <button class="linkbtn" onclick="setDur('${s.id}')">cambiar</button>`}).</p>

function wellEdit(sid,pid){const s=sess(sid);const p=player(pid);const d=$("#dlg");

function loadCard(p){const {cur,ch,r,W}=acwr(p.id);const keys=Object.keys(W).sort().slice(-8);if(!keys.length)return "";const mx=Math.max(...keys.map(k=>W[k]),1);
  const last=db.sessions.filter(s=>(s.well||{})[p.id]).sort((a,b)=>b.date.localeCompare(a.date))[0];const lw=last&&last.well[p.id];

   <div class="kpis" style="margin-top:8px"><div class="kpi"><b>${cur}</b><small>carga esta semana</small></div><div class="kpi"><b>${Math.round(ch)}</b><small>media 4 semanas</small></div><div class="kpi ${r>1.5?"warnk":""}"><b>${r?r.toFixed(2):"–"}</b><small>ratio</small></div></div>
   ${r>1.5?`<p class="warntxt">⚠️ Esta semana lleva bastante más carga de lo normal (más de 1,5 veces su media). Más riesgo de lesión: vigila o baja la intensidad.</p>`:r&&r<.8&&ch?`<p class="muted">Esta semana va por debajo de su media.</p>`:""}
   ${lw?`<p class="muted" style="margin-bottom:0">Última valoración (${fmtDate(last.date)}): cansancio ${lw.fat}, sueño ${lw.sleep}, dolor ${lw.pain}${lw.note?" · “"+esc(lw.note)+"”":""}</p>`:""}</div>`}
function loadHomeCard(){const out=[];db.players.forEach(p=>{if(injured(p))return;const last=db.sessions.filter(s=>(s.well||{})[p.id]&&s.date>=addDays(today(),-7)).sort((a,b)=>b.date.localeCompare(a.date))[0];const w=last&&last.well[p.id];const {r}=acwr(p.id);
  const why=[];if(w&&w.pain>=7)why.push("dolor "+w.pain);if(w&&w.fat>=8)why.push("cansancio "+w.fat);if(w&&w.sleep<=3)why.push("duerme mal");if(r>1.5)why.push("carga ×"+r.toFixed(1));if(why.length)out.push({p,why})});
  if(!out.length)return "";return `<div class="card"><h3>⚠️ Ojo con la carga</h3><ul class="list">${out.map(x=>`<li class="click" onclick="tab='roster';selPlayer='${x.p.id}';render()">${avatar(x.p)}<div class="grow"><b>${esc(x.p.name)}</b><div class="muted">${x.why.join(" · ")}</div></div><span>›</span></li>`).join("")}</ul></div>`}
function addDays(d,n){const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}

async function pubGet(url,a,sid){const r=await fetch(url+(url.includes("?")?"&":"?")+"a="+a+"&sid="+encodeURIComponent(sid));const j=await r.json();
  if(j.db){const s=j.db.sessions.find(x=>x.id===sid);return s?{ok:true,team:j.db.team,session:s,players:j.db.players,live:s.live||null}:{ok:false}}return j}

  const s=data.session;$("#teamTitle").textContent="🏐 "+data.team;const ps=[...data.players].sort((a,b)=>(+a.number||999)-(+b.number||999));
  let me=null;try{me=localStorage.getItem("voleibol-me")}catch(e){}
  const draw=msg=>{app.innerHTML=`<div class="card"><h2>💪 ¿Qué tal el ${s.type==="partido"?"partido":"entreno"}?</h2><div class="muted">${fmtDate(s.date)}${s.title?" · "+esc(s.title):""}</div></div>
   <form class="card" id="wf" onsubmit="event.preventDefault();wellSend()"><label>¿Quién eres?</label><select name="me" required><option value="">Elige tu nombre…</option>${ps.map(p=>`<option value="${p.id}" ${p.id===me?"selected":""}>${esc(p.number)} ${esc(p.name)}</option>`).join("")}</select>
   ${wellForm()}<div class="row" style="margin-top:14px"><button class="btn grow">Enviar</button></div>${msg?`<p style="margin-bottom:0"><b>${msg}</b></p>`:""}</form>
   <p class="muted" style="text-align:center">Solo lo ve tu entrenador. Sirve para ajustar los entrenos y evitar lesiones.</p>`};
  window.wellSend=async()=>{const f=$("#wf");const pid=f.me.value;if(!pid){alert("Elige tu nombre");return}me=pid;try{localStorage.setItem("voleibol-me",pid)}catch(e){}
    const v=wellRead(f);app.querySelector("button.btn").disabled=true;
    try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:"well",sid,pid,v})});const j=await r.json();if(!j.ok)throw 0;
      app.innerHTML=`<div class="card empty"><div style="font-size:3rem">✅</div><h2>¡Gracias!</h2><p>Tu valoración está guardada.</p></div>`}catch(e){draw("⚠️ No se pudo enviar. Inténtalo de nuevo.")}};
  draw()}
async function livePage(sid,url){pubShell();const app=$("#app");app.innerHTML=`<div class="card empty">Cargando marcador…</div>`;let fails=0;
  const tick=async()=>{let d=null;try{d=await pubGet(url,"live",sid)}catch(e){}
    if(!d||!d.ok){if(++fails>2)app.innerHTML=`<div class="card empty">No se encuentra el partido.</div>`;return}fails=0;$("#teamTitle").textContent="🏐 "+d.team;
    const s=d.session,L=d.live;const cur=L&&L.sets.find(x=>x.n===L.set)||{us:0,them:0};const fresh=L&&Date.now()-L.at<15*60000;

/* ---------- ESTADÍSTICAS DE TEMPORADA ---------- */
function seasonRows(){
  const ms=db.sessions.filter(s=>s.type==="partido");
  return {ms,rows:sortedPlayers().map(p=>{const r={p,pj:ms.filter(s=>present(s,p.id)).length,A:0,B:0,S:0,E:0};const rec=[],srv=[];
    ms.forEach(s=>evs(s).forEach(e=>{if(e.p!==p.id)return;if(e.t==="r")rec.push(e.v);else if(e.t==="q")srv.push(e.v);else if(r[e.t]!==undefined)r[e.t]++}));
    r.pts=r.A+r.B+r.S;r.rec=avg(rec);r.srv=avg(srv);return r}).sort((a,b)=>b.pts-a.pts)};
}
function vStats(){
  const {ms,rows}=seasonRows();
  if(!ms.length)return `<div class="card"><h2>Estadísticas</h2><div class="empty">Crea un <b>partido</b> en Calendario y apunta los puntos durante el partido. Aquí verás el resumen de la temporada.</div></div>`+testsTeamCard();
  const T={A:0,B:0,S:0,E:0,opp:0,R:0};ms.forEach(s=>evs(s).forEach(e=>{if(e.p==="opp")T[e.t==="E"?"opp":"R"]++;else if(T[e.t]!==undefined)T[e.t]++}));
  const won=T.A+T.B+T.S,tot=won+T.opp||1;
  const seg=(v,c,l)=>v?`<i title="${l}" style="width:${v*100/tot}%;background:${c}"></i>`:"";
  const weakest=won?[["A","Ataque"],["B","Bloqueo"],["S","Saque"]].sort((a,b)=>T[a[0]]-T[b[0]])[0][1]:null;
  const bySet=[1,2,3,4,5].map(n=>{let w=0,l=0;ms.forEach(s=>{const x=setScores(s).sets.find(y=>y.n===n);if(x){if(x.us>x.them)w++;else if(x.them>x.us)l++}});return{n,w,l}}).filter(x=>x.w||x.l);
  const lost=T.E+T.R;
  return `<div class="card"><h2>Temporada · ${ms.length} partido${ms.length>1?"s":""}</h2>
  ${ms.length<3?`<p class="muted" style="margin-top:0">⚠️ Con menos de 3 partidos los números todavía son ruido. A partir de 3 se ve una tendencia, y con 8-10 un perfil fiable.</p>`:""}
  <div class="bar" style="height:16px;display:flex">${seg(T.A,"#1f6feb","Ataque")}${seg(T.B,"#7c3aed","Bloqueo")}${seg(T.S,"#16a34a","Saque")}${seg(T.opp,"#9aa3b2","Error rival")}</div>
  <div class="row" style="margin-top:8px;gap:6px"><span class="pill">🔵 Ataque ${T.A}</span><span class="pill">🟣 Bloqueo ${T.B}</span><span class="pill">🟢 Saque ${T.S}</span><span class="pill">⚪ Error rival ${T.opp}</span></div>
  <p style="margin-bottom:0"><b>Puntos ganados: ${won+T.opp}</b> (${won} conseguidos por nosotros y ${T.opp} por errores del rival).<br><b style="color:var(--bad)">Puntos perdidos: ${lost}</b> (${T.E} por errores propios y ${T.R} ganados por el rival).</p>
  ${lost?`<p class="muted">${T.E>=T.R?"🔴 Perdemos más puntos por <b>errores propios</b> que porque el rival los gane: reducir errores es lo más rentable.":"🔴 El rival gana más puntos de los que regalamos: toca trabajar defensa y bloqueo."}</p>`:""}
  ${weakest?`<p class="muted">💡 La vía que menos puntos da es el <b>${weakest.toLowerCase()}</b>: buen candidato para centrar los entrenos.</p>`:""}</div>
  ${bySet.length?`<div class="card"><h3>Sets ganados y perdidos según el número de set</h3><div class="row">${bySet.map(x=>`<span class="pill ${x.w>=x.l?"ok":"bad"}">Set ${x.n}: ${x.w} G – ${x.l} P</span>`).join("")}</div><p class="muted">Sirve para responder preguntas como “¿por qué perdemos los terceros sets?”.</p></div>`:""}
  <div class="card"><h2>Por jugador/a</h2><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Jugador/a</th><th>PJ</th><th>Ata</th><th>Blo</th><th>Saq</th><th>Pts</th><th>Err</th><th>Rec</th><th>Saq★</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="click${r.pj<2?" low":""}" onclick="tab='roster';selPlayer='${r.p.id}';render();scrollTo(0,0)"><td>${esc(r.p.number)} ${esc(r.p.name)}</td><td>${r.pj}</td><td>${r.A}</td><td>${r.B}</td><td>${r.S}</td><td><b>${r.pts}</b></td><td>${r.E}</td><td>${r.rec??"–"}</td><td>${r.srv??"–"}</td></tr>`).join("")}
  </tbody></table></div><p class="muted">PJ = partidos jugados · Rec y Saq★ = nota media 0-3. En gris, quien ha jugado poco: no saques conclusiones todavía. Mira la proporción: no es lo mismo 10 puntos de ataque que 10 con 5 bloqueos. Toca una fila para ver su ficha.</p></div>
  <div class="card"><h2>Partido a partido</h2><ul class="list">${[...ms].filter(s=>evs(s).length||s.date<=today()).sort((a,b)=>b.date.localeCompare(a.date)).map(s=>{const m=matchSum(s);const sc=setScores(s);return `<li class="click" onclick="tab='cal';openSession('${s.id}')"><div class="grow"><b>${fmtDate(s.date)}</b> ${esc(s.title)} ${sc.sets.length?`<span class="pill ${sc.won>sc.lost?"ok":sc.won<sc.lost?"bad":""}">${sc.won}-${sc.lost}</span>`:""}<div class="muted">Ganados ${m.won} + ${m.opp} por error rival · perdidos ${m.given} por errores + ${m.rival} del rival</div></div><span>›</span></li>`}).join("")}</ul>
  <div class="row" style="margin-top:8px"><button class="btn sec small" onclick="exportStatsCSV()">📊 Exportar CSV</button></div></div>
  ${rotSeasonCard()}
  ${playTimeCard()}
  ${mapStatsCard()}
  ${testsTeamCard()}
  <div class="card"><h3>Consejos</h3><p class="muted" style="margin:0">Empieza con una pregunta concreta (“¿por qué perdemos los terceros sets?”). Comparte una conclusión por semana con el equipo, y los números individuales háblalos en privado, como un espejo, no como una nota.</p></div>`;
}
function exportStatsCSV(){const {rows}=seasonRows();const r=[["Dorsal","Nombre","Partidos","Ataque","Bloqueo","Saque","Puntos","Errores","Recepción media","Saque medio"],...rows.map(x=>[x.p.number,x.p.name,x.pj,x.A,x.B,x.S,x.pts,x.E,x.rec??"",x.srv??""])];download(`estadisticas-${today()}.csv`,"﻿"+r.map(l=>l.map(csvq).join(",")).join("\n"),"text/csv")}

function playVid(id){const v=db.videos.find(x=>x.id===id);const el=document.getElementById("pf-"+id);if(!el)return;if(el.innerHTML){el.innerHTML="";return}

/* ---------- ROTACIÓN ---------- */
const FRONT=[4,3,2],BACK=[5,6,1];
const abbr=p=>({Colocador:"COL",Opuesto:"OP",Receptor:"REC",Central:"CEN","Líbero":"LIB"}[p]||"");
function slotBtn(n){const p=player(db.lineup.slots[n-1]);
  return `<div class="slot"><button class="${selSlot===n?"sel":""} ${n===1?"serve":""}" ${p?`style="background:${pc(p.pos)}"`:""} onclick="tapSlot(${n})"><span class="pos">P${n}${n===1?" · saca":""}</span>${p?`<b>${esc(p.number||"?")}</b><small>${esc(p.name)}</small><small>${esc(abbr(p.pos))}</small>`:`<b>+</b><small>vacío</small>`}</button></div>`}
function vRot(){
  const T=[["sys","🔄","Rotaciones"],["board","✏️","Pizarra"],["lib","📚","Ejemplos"],["lineup","👥","Alineación"]];
  const head=`<div class="tacnav">${T.map(([k,i,l])=>`<button class="${rotTab===k?"on":""}" onclick="rotTab='${k}';render()"><span>${i}</span>${l}</button>`).join("")}</div>`;
  if(rotTab==="sys")return head+vSystems();if(rotTab==="board")return head+vBoard();if(rotTab==="lib")return head+vLib();
  return head+vRotLineup()}
function vRotLineup(){
  const L=db.lineup;const lib=player(L.libero);
  const bench=sortedPlayers().filter(p=>!L.slots.includes(p.id)&&p.id!==L.libero);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Rotación ${L.rot} de 6</h2>
   <div class="row"><button class="btn sec small" onclick="rotate(-1)">↺ Atrás</button><button class="btn small" onclick="rotate(1)">Rotar ↻</button></div></div>
   <p class="muted">Toca una posición para poner a alguien. Toca dos posiciones seguidas para intercambiarlas. La red está arriba.</p>
   <div class="legend" style="margin-bottom:10px">${Object.keys(POSC).filter(k=>k!=="Otro").map(posTag).join("")}</div>
   <div class="court-wrap"><div class="net"></div><div class="court">${FRONT.map(slotBtn).join("")}${BACK.map(slotBtn).join("")}</div></div>
   ${selSlot?pickPanel(bench):""}</div>
  <div class="card"><h3>Líbero</h3><select onchange="db.lineup.libero=this.value||null;save();render()"><option value="">— Sin líbero —</option>${sortedPlayers().filter(p=>!L.slots.includes(p.id)).map(p=>`<option value="${p.id}" ${p.id===L.libero?"selected":""}>${esc(p.number)} ${esc(p.name)}</option>`).join("")}</select>
   ${lib?`<p class="muted">Entra por el central cuando esté en zaguera: ${BACK.map(n=>player(L.slots[n-1])).filter(p=>p&&p.pos==="Central").map(p=>esc(p.name)).join(", ")||"ninguno ahora"}.</p>`:""}</div>
  <div class="card"><h3>Banquillo (${bench.length})</h3>${bench.length?bench.map(p=>`<span class="ptag" style="--pc:${pc(p.pos)};margin:2px">${esc(p.number)} ${esc(p.name)}</span>`).join(""):'<div class="muted">Nadie en el banquillo.</div>'}
   <div class="row" style="margin-top:10px"><button class="btn sec small" onclick="saveLineup()">💾 Guardar alineación</button><button class="btn danger small" onclick="clearLineup()">Vaciar pista</button></div>
   ${db.lineups.length?`<h3 style="margin-top:14px">Alineaciones guardadas</h3><ul class="list">${db.lineups.map((l,i)=>`<li><div class="grow">${esc(l.name)}</div><button class="btn sec small" onclick="loadLineup(${i})">Cargar</button><button class="btn danger small" onclick="delLineup(${i})">✕</button></li>`).join("")}</ul>`:""}</div>`;
}
function pickPanel(bench){const cur=player(db.lineup.slots[selSlot-1]);
  return `<div class="card" style="margin-top:12px;background:var(--bg)"><h3>Posición ${selSlot}</h3>
  <div class="row">${bench.map(p=>`<button class="btn sec small" onclick="assign('${p.id}')">${esc(p.number)} ${esc(p.name)}</button>`).join("")||'<span class="muted">No hay nadie libre en el banquillo.</span>'}</div>
  <div class="row" style="margin-top:8px">${cur?`<button class="btn danger small" onclick="assign(null)">Quitar a ${esc(cur.name)}</button>`:""}<button class="btn sec small" onclick="selSlot=null;render()">Cerrar</button></div></div>`}
function tapSlot(n){if(selSlot&&selSlot!==n){const s=db.lineup.slots;[s[selSlot-1],s[n-1]]=[s[n-1],s[selSlot-1]];selSlot=null;save();render();return}selSlot=selSlot===n?null:n;render()}
function assign(pid){db.lineup.slots[selSlot-1]=pid;selSlot=null;save();render()}
function rotate(dir){const s=db.lineup.slots;db.lineup.slots=dir>0?[s[1],s[2],s[3],s[4],s[5],s[0]]:[s[5],s[0],s[1],s[2],s[3],s[4]];db.lineup.rot=((db.lineup.rot-1+dir+6)%6)+1;selSlot=null;save();render()}
function clearLineup(){if(!confirm("¿Vaciar la pista?"))return;db.lineup={slots:[null,null,null,null,null,null],libero:null,rot:1};save();render()}
function saveLineup(){const name=prompt("Nombre de la alineación","Titular");if(!name)return;db.lineups.push({id:uid(),name,slots:[...db.lineup.slots],libero:db.lineup.libero});save();render();toast("Alineación guardada")}
function loadLineup(i){const l=db.lineups[i];db.lineup={slots:l.slots.map(id=>player(id)?id:null),libero:player(l.libero)?l.libero:null,rot:1};save();render()}
function delLineup(i){db.lineups.splice(i,1);save();render()}

/* ---------- EJERCICIOS ---------- */
let selExercise=null,exQ="";
const exVideos=x=>[...(x.videos||[]),...(x.url&&!(x.videos||[]).includes(x.url)?[x.url]:[])];
function exThumb(x){const im=(x.images||[])[0];if(im)return `<div class="exthumb" style="background-image:url('${esc(im)}')"></div>`;
  const y=exVideos(x).map(ytId).find(Boolean);if(y)return `<div class="exthumb" style="background-image:url('https://i.ytimg.com/vi/${y}/mqdefault.jpg')"><span>▶</span></div>`;
  if(x.play)return `<div class="exthumb board">${miniBoardSvg(x.play,0)}</div>`;return `<div class="exthumb empty">${{"Calentamiento":"🔥","Técnica":"🎯","Táctica":"🧠","Físico":"💪","Juego":"🏐","Vuelta a la calma":"🧘"}[x.cat]||"🏋️"}</div>`}
function miniBoardSvg(B,fi,id){const F=B.frames[fi||0];return `<svg ${id?`id="${id}"`:""} viewBox="-1.5 -1.5 12 21" style="width:100%;display:block;border-radius:10px">${markers()}${courtSvg(true)}<g class="mdraw">${F.draw.map(drawSvg).join("")}</g><g class="mtoks">${B.tokens.map(t=>{const p=F.pos[t.id];return p?tokSvg(t,p[0],p[1]):""}).join("")}</g></svg>`}
function animMini(id,B){const svg=document.getElementById(id);if(!svg||B.frames.length<2)return;let i=0;const btn=document.getElementById(id+"-b");if(btn)btn.disabled=true;
  const step=()=>{if(!document.getElementById(id))return;if(i>=B.frames.length-1){if(btn)btn.disabled=false;return}const A=B.frames[i],Z=B.frames[i+1];const t0=performance.now();
    svg.querySelector(".mdraw").innerHTML=A.draw.map(drawSvg).join("");const cap=document.getElementById(id+"-c");if(cap)cap.textContent=Z.note?`Paso ${i+2}. ${Z.note}`:"";
    const tick=now=>{const k=Math.min(1,(now-t0)/1100);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      svg.querySelectorAll(".mtoks [data-tid]").forEach(g=>{const a=A.pos[g.dataset.tid],z=Z.pos[g.dataset.tid]||a;if(a)g.setAttribute("transform",`translate(${a[0]+(z[0]-a[0])*e} ${a[1]+(z[1]-a[1])*e})`)});
      if(k<1)requestAnimationFrame(tick);else{i++;svg.querySelector(".mdraw").innerHTML=Z.draw.map(drawSvg).join("");setTimeout(step,800)}};requestAnimationFrame(tick)};step()}
function vEx(){if(selExercise&&db.exercises.find(e=>e.id===selExercise))return vExDetail(db.exercises.find(e=>e.id===selExercise));
  const q=norm(exQ);const xs=db.exercises.filter(e=>(!exfilter||e.cat===exfilter)&&(!q||norm(e.name+" "+(e.desc||"")).includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="row" style="margin-bottom:12px"><input id="exq" class="grow" placeholder="🔍 Buscar ejercicio…" value="${esc(exQ)}" oninput="exQ=this.value;clearTimeout(window._xq);window._xq=setTimeout(()=>{render();const i=$('#exq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},300)"><button class="btn" onclick="newExercise()">＋ Nuevo</button></div>
  <div class="chips" style="margin-bottom:12px"><button class="chip ${exfilter?"":"si"}" onclick="exfilter='';render()">Todos (${db.exercises.length})</button>${EXCAT.map(c=>`<button class="chip ${exfilter===c?"si":""}" onclick="exfilter='${c}';render()">${c}</button>`).join("")}</div>
    ${xs.length?`<div class="exgrid">${xs.map(e=>`<button class="excard" onclick="selExercise='${e.id}';render();scrollTo(0,0)">${exThumb(e)}<div class="exbody"><b>${esc(e.name)}</b><small>${esc(e.cat)}${e.mins?" · "+e.mins+" min":""}</small><span class="exicons">${exVideos(e).length?`🎬 ${exVideos(e).length}`:""} ${(e.images||[]).length?`📷 ${e.images.length}`:""} ${e.play?"🧑‍🏫 pizarra":""}</span></div></button>`).join("")}</div>`+(db.exercises.some(e=>e.seed)?"":`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn sec small" onclick="seedExercises()">📚 Añadir ejercicios de ejemplo con pizarra</button></div>`)
   :`<div class="card empty">${db.exercises.length?"Nada coincide con la búsqueda.":"Aún no hay ejercicios."}<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sec small" onclick="seedExercises()">📚 Añadir ejercicios de ejemplo</button></div></div>`}`}
function vExDetail(x){const vids=exVideos(x);
  return `<div class="row" style="margin-bottom:10px"><button class="btn sec small" onclick="selExercise=null;render()">‹ Ejercicios</button></div>
  <div class="card"><h2 style="margin-bottom:4px">${esc(x.name)}</h2><div class="row"><span class="pill">${esc(x.cat)}</span>${x.mins?`<span class="pill">⏱ ${x.mins} min</span>`:""}</div>
   ${x.desc?`<p class="note" style="margin-bottom:0">${esc(x.desc)}</p>`:""}
   <div class="row" style="margin-top:12px"><button class="btn sec small" onclick="editExercise('${x.id}')">✎ Editar</button><button class="btn sec small" onclick="exToBoard('${x.id}')">✏️ ${x.play?"Editar dibujo":"Dibujar en la pizarra"}</button></div></div>
  ${x.play?`<div class="card"><h3>🧑‍🏫 Organización</h3><div class="exboard">${miniBoardSvg(x.play,0,"exb")}</div><p class="muted" id="exb-c" style="min-height:1.2em">${x.play.frames[0].note?esc("Paso 1. "+x.play.frames[0].note):""}</p>${x.play.frames.length>1?`<button class="btn" id="exb-b" onclick="this.parentNode.querySelector('.exboard').innerHTML=miniBoardSvg(db.exercises.find(e=>e.id==='${x.id}').play,0,'exb');animMini('exb',db.exercises.find(e=>e.id==='${x.id}').play)">▶ Ver animado</button>`:""}</div>`:""}
  <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🎬 Vídeos</h3><button class="btn sec small" onclick="addExVideo('${x.id}')">＋ Vídeo</button></div>
   ${vids.length?vids.map((u,i)=>{const em=embedUrl(u);return `<div style="margin-top:10px">${em?`<div class="player-frame"><iframe src="${em}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`:`<a class="btn sec small" href="${esc(u)}" target="_blank" rel="noopener">▶ Abrir vídeo</a> <span class="muted">${esc(u.replace(/^https?:\/\//,"").slice(0,40))}</span>`}
     <div class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn danger small" onclick="delExVideo('${x.id}',${i})">Quitar</button></div></div>`}).join(""):`<p class="muted" style="margin-bottom:0">Pega un enlace de YouTube o Google Drive y se verá aquí dentro. Otros enlaces (Instagram, TikTok…) se abren aparte.</p>`}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">📷 Imágenes</h3><label class="btn sec small" style="margin:0;color:var(--text)">＋ Foto<input type="file" accept="image/*" multiple hidden onchange="addExImages('${x.id}',this)"></label></div>
   ${(x.images||[]).length?`<div class="exphotos">${x.images.map((im,i)=>`<button onclick="viewExImage('${x.id}',${i})" style="background-image:url('${esc(im)}')" aria-label="Ver imagen"></button>`).join("")}</div>`:`<p class="muted" style="margin-bottom:0">Haz una foto de la pizarra del pabellón o sube un esquema.</p>`}</div>
  <div class="card"><button class="btn danger small" onclick="delEx('${x.id}')">Eliminar ejercicio</button></div>`}
function exForm(x){return `<label>Nombre</label><input name="name" value="${esc(x.name||"")}" required placeholder="Ej. Recepción en W con saque">
  <div class="row"><div class="grow"><label>Tipo</label><select name="cat">${EXCAT.map(c=>`<option ${c===x.cat?"selected":""}>${c}</option>`).join("")}</select></div><div style="width:110px"><label>Minutos</label><input name="mins" type="number" inputmode="numeric" value="${esc(x.mins||"")}"></div></div>
  <label>Explicación</label><textarea name="desc" rows="4" placeholder="Organización, reglas, variantes…">${esc(x.desc||"")}</textarea>
  <label>Vídeo de ejemplo (opcional)</label><input name="url" type="url" placeholder="https://youtube.com/…">`}
function newExercise(){const d=$("#dlg");d.innerHTML=`<form method="dialog" id="exf"><h3>Nuevo ejercicio</h3>${exForm({})}<div class="row" style="justify-content:flex-end;margin-top:14px"><button value="cancel" class="btn sec" formnovalidate>Cancelar</button><button value="ok" class="btn">Crear</button></div></form>`;
  d.showModal();d.onclose=()=>{if(d.returnValue!=="ok")return;const f=$("#exf");if(!f.name.value.trim())return;const x={id:uid(),name:f.name.value.trim(),cat:f.cat.value,mins:f.mins.value,desc:f.desc.value.trim(),videos:f.url.value.trim()?[f.url.value.trim()]:[],images:[]};db.exercises.push(x);selExercise=x.id;save();render();scrollTo(0,0)}}
function editExercise(id){const x=db.exercises.find(e=>e.id===id);const d=$("#dlg");d.innerHTML=`<form method="dialog" id="exf"><h3>Editar ejercicio</h3>${exForm(x).replace(/<label>Vídeo de ejemplo[\s\S]*$/,"")}<div class="row" style="justify-content:flex-end;margin-top:14px"><button value="cancel" class="btn sec" formnovalidate>Cancelar</button><button value="ok" class="btn">Guardar</button></div></form>`;
  d.showModal();d.onclose=()=>{if(d.returnValue!=="ok")return;const f=$("#exf");Object.assign(x,{name:f.name.value.trim()||x.name,cat:f.cat.value,mins:f.mins.value,desc:f.desc.value.trim()});save();render()}}
function addExVideo(id){const u=prompt("Pega el enlace del vídeo (YouTube, Google Drive…)");if(!u||!u.trim())return;const x=db.exercises.find(e=>e.id===id);x.videos=exVideos(x);delete x.url;x.videos.push(u.trim());save();render()}
function delExVideo(id,i){if(!confirm("¿Quitar este vídeo?"))return;const x=db.exercises.find(e=>e.id===id);x.videos=exVideos(x);delete x.url;x.videos.splice(i,1);save();render()}
function addExImages(id,inp){const x=db.exercises.find(e=>e.id===id);x.images=x.images||[];const files=[...inp.files];let left=files.length;if(!left)return;toast("Preparando imágenes…");
  files.forEach(f=>{const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const M=900;const k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);x.images.push(c.toDataURL("image/jpeg",.72));URL.revokeObjectURL(url);if(--left===0){save();render();toast("Imágenes guardadas")}};img.onerror=()=>{if(--left===0){save();render()}};img.src=url})}
function viewExImage(id,i){const x=db.exercises.find(e=>e.id===id);const d=$("#dlg");d.innerHTML=`<img src="${esc(x.images[i])}" style="width:100%;border-radius:12px;display:block" alt=""><div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn danger small" onclick="delExImage('${id}',${i})">Borrar foto</button><button class="btn sec" onclick="$('#dlg').close()">Cerrar</button></div>`;d.onclose=null;d.showModal()}
function delExImage(id,i){if(!confirm("¿Borrar esta foto?"))return;const x=db.exercises.find(e=>e.id===id);x.images.splice(i,1);save();$("#dlg").close();render()}

function saveBoardToEx(){const B=curBoard();const x=db.exercises.find(e=>e.id===B.exId);if(!x){toast("El ejercicio ya no existe");return}const copy=JSON.parse(JSON.stringify(B));delete copy.exId;x.play=copy;save();tab="ex";selExercise=x.id;render();scrollTo(0,0);toast("Dibujo guardado en el ejercicio")}
function openEx(id){tab="ex";selExercise=id;$("#dlg").open&&$("#dlg").close();render();scrollTo(0,0)}
function delEx(id){if(!confirm("¿Eliminar este ejercicio?"))return;db.exercises=db.exercises.filter(e=>e.id!==id);db.sessions.forEach(s=>{if(s.plan)s.plan=s.plan.filter(x=>x!==id)});selExercise=null;save();if($("#dlg").open)$("#dlg").close();render()}
function seedExercises(){const L=examples();const add=(eid,cat,mins,desc)=>{const e=L.find(z=>z.id===eid);if(!e||db.exercises.some(x=>x.seed===eid))return;db.exercises.push({id:uid(),seed:eid,name:e.name.replace(/^Ejercicio: /,""),cat,mins,desc:desc||e.desc,videos:[],images:[],play:{id:uid(),name:e.name,tokens:e.tokens,frames:e.frames}})};
  add("ex-d1","Técnica",15,"Entrenador saca desde el otro campo. Tres receptores, uno por zona, pasan a la diana de colocación. Cuenta un punto por balón en la diana; rotan al cono siguiente cada 5 balones.");

  add("ex-d3","Técnica",12,"El entrenador ataca desde un cajón al otro lado de la red. Tres defensores en triángulo; la defensa tiene que llegar a la diana del colocador.");
  add("ex-w4","Táctica",20,"Side-out básico en 6x6: recepción en W, penetración del colocador y ataque por 4 con cobertura.");

  save();render();toast("Ejercicios de ejemplo añadidos")}

/* ---------- NOTAS ---------- */
function vNotes(){
  const q=notesQ.toLowerCase();const ns=[...db.notes].filter(n=>!q||((n.title||"")+" "+n.text+" "+(player(n.player)?.name||"")).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));

function avatarSvg(seed,num,col){

  const skin=["#f6d3b3","#eab88f","#d49a6a","#a96f44","#7a4a2a","#f1c7a1"][Math.floor(r(1)*6)];
  const hair=["#2b1a10","#5a3311","#8a5a2b","#c58b3a","#e3c16f","#1d1d1d","#7b2f1a"][Math.floor(r(2)*7)];
  const bg=["#dbeafe","#ede9fe","#dcfce7","#fef3c7","#fee2e2","#e0f2fe"][Math.floor(r(3)*6)];
  const style=Math.floor(r(4)*4);
  const back=style===0?`<path d="M22 46 Q20 86 30 96 L70 96 Q80 86 78 46 Z" fill="${hair}"/>`:style===1?`<circle cx="50" cy="20" r="11" fill="${hair}"/>`:style===2?`<path d="M70 40 Q92 52 84 80 Q78 66 70 60 Z" fill="${hair}"/>`:"";
  const front=style===3?`<path d="M28 46 Q28 22 50 22 Q72 22 72 46 Q66 34 50 33 Q34 34 28 46 Z" fill="${hair}"/>`:`<path d="M27 50 Q26 22 50 22 Q74 22 73 50 Q68 34 50 32 Q32 34 27 50 Z" fill="${hair}"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>${back}<path d="M18 100 Q20 76 50 74 Q80 76 82 100 Z" fill="${col||"#1f6feb"}"/><text x="50" y="96" font-family="Arial" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">${esc(num||"")}</text><rect x="44" y="62" width="12" height="12" fill="${skin}"/><ellipse cx="50" cy="48" rx="20" ry="22" fill="${skin}"/>${front}<circle cx="42.5" cy="50" r="2.4" fill="#222"/><circle cx="57.5" cy="50" r="2.4" fill="#222"/><path d="M43 59 Q50 64 57 59" stroke="#8a3b2a" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
function hashStr(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%9973;return h}
function avatar(p,big){const src=p.photo||avatarSvg(p.av!=null?p.av:hashStr(p.id),p.number,pc(p.pos));return `<img class="av${big?" big":""}" style="border:2px solid ${pc(p.pos)}" src="${src}" alt="">`}
function setPhoto(id,inp){const f=inp.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{const c=document.createElement("canvas");const S=160;c.width=c.height=S;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);player(id).photo=c.toDataURL("image/jpeg",.75);URL.revokeObjectURL(url);save();render();toast("Foto guardada")};
  img.onerror=()=>toast("No se pudo leer la imagen");img.src=url}

const fmtV=(v,u)=>(Math.round(v*100)/100).toLocaleString("es-ES")+" "+u;
function spark(vals,col){if(vals.length<2)return "";const w=90,h=28,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i*(w-6)/(vals.length-1)+3).toFixed(1)},${(h-3-(v-mn)*(h-6)/r).toFixed(1)}`).join(" ");
  const last=pts.split(" ").pop().split(",");return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${col}"/></svg>`}
function trend(t,arr){if(arr.length<2)return {txt:"primera medición",cls:"muted",col:"var(--muted)"};const d=arr[arr.length-1].v-arr[0].v;
  if(Math.abs(d)<1e-9)return {txt:"igual que al principio",cls:"muted",col:"#64748b"};
  const good=t.up===null?null:(t.up?d>0:d<0);const pctc=arr[0].v?Math.round(Math.abs(d)*100/arr[0].v):0;
  return {txt:`${d>0?"+":"−"}${fmtV(Math.abs(d),t.u)} (${pctc}%) desde ${fmtDate(arr[0].date)}`,cls:good===null?"muted":good?"money-in":"money-out",col:good===null?"#64748b":good?"#16a34a":"#dc2626"}}
function testsCard(p){

function bigChart(a,t){if(a.length<2)return "";const w=320,h=120,pad=26,vs=a.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;

let selLeague=null,leagueTab="tabla",selTeam=null;
const LEAGUE_DEFAULTS=["Liga Canaria Oro Sénior Masculina","Liga Canaria Plata Sénior Masculina","Liga Canaria Oro Sénior Femenina","Liga Canaria Plata Sénior Femenina"];
function ensureLeagues(){db.leagues=db.leagues||[];if(!db.leagues.length&&!db.leaguesInit){LEAGUE_DEFAULTS.forEach(n=>db.leagues.push({id:uid(),name:n,season:"2026-27",teams:[],matches:[]}));db.leaguesInit=true;persist()}}
const lg=()=>db.leagues.find(l=>l.id===selLeague);
const tname=(L,id)=>(L.teams.find(t=>t.id===id)||{}).name||"?";
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function setsOf(m){// devuelve {h,a,pf,pc,detail}
  if(m.sets&&m.sets.length){let h=0,a=0,ph=0,pa=0;m.sets.forEach(([x,y])=>{if(x>y)h++;else if(y>x)a++;ph+=x;pa+=y});return {h,a,ph,pa,detail:true}}
  if(m.hs!=null&&m.as!=null)return {h:+m.hs,a:+m.as,ph:0,pa:0,detail:false};return null}
function standings(L){const T={};L.teams.forEach(t=>T[t.id]={t,pj:0,pg:0,pp:0,pts:0,sf:0,sc:0,pf:0,pc:0,form:[]});
  [...L.matches].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.j||0)-(b.j||0)).forEach(m=>{const r=setsOf(m);if(!r||!T[m.home]||!T[m.away])return;if(r.h<3&&r.a<3)return;
    const H=T[m.home],A=T[m.away];H.pj++;A.pj++;H.sf+=r.h;H.sc+=r.a;A.sf+=r.a;A.sc+=r.h;H.pf+=r.ph;H.pc+=r.pa;A.pf+=r.pa;A.pc+=r.ph;
    const hw=r.h>r.a,five=r.h+r.a===5;const W=hw?H:A,Lo=hw?A:H;W.pg++;Lo.pp++;W.pts+=five?2:3;Lo.pts+=five?1:0;W.form.push("G");Lo.form.push("P")});
  const ratio=(a,b)=>b?a/b:(a?99:0);
  if(L.official&&L.official.length){const out=[];L.official.slice().sort((a,b)=>a.pos-b.pos).forEach(o=>{const r=T[o.tid];if(!r)return;Object.assign(r,{pts:o.pts,pj:o.pj,pg:o.pg,pp:o.pp,sf:o.sf,sc:o.sc,pf:o.pf,pc:o.pc});out.push(r);delete T[o.tid]});return out.concat(Object.values(T))}
  return Object.values(T).sort((x,y)=>y.pts-x.pts||y.pg-x.pg||ratio(y.sf,y.sc)-ratio(x.sf,x.sc)||ratio(y.pf,y.pc)-ratio(x.pf,x.pc)||x.t.name.localeCompare(y.t.name))}
function vLeagues(){ensureLeagues();lvEnsure();lvAuto();

  return `<div class="card"><h2>🏆 Ligas</h2><p class="muted" style="margin-top:0">Sigue la clasificación y los resultados de cualquier liga. La clasificación se calcula sola con la puntuación oficial de voleibol: 3-0 o 3-1 da 3 puntos al ganador; 3-2 da 2 al ganador y 1 al perdedor.</p>
  <ul class="list">${db.leagues.map(L=>{const st=standings(L);const mine=st.findIndex(r=>r.t.mine);return `<li class="click" onclick="selLeague='${L.id}';leagueTab='tabla';selTeam=null;render();scrollTo(0,0)"><div class="grow"><b>${esc(L.name)}</b><div class="muted">${esc(L.season||"")} · ${L.teams.length} equipos · ${L.matches.filter(m=>setsOf(m)).length} partidos jugados${mine>=0?` · <b style="color:var(--brand)">${esc(st[mine].t.name)}: ${mine+1}º</b>`:""}</div></div><span>›</span></li>`}).join("")}</ul>

function addLeague(e){e.preventDefault();const f=e.target;db.leagues.push({id:uid(),name:f.name.value.trim(),season:f.season.value.trim(),teams:[],matches:[]});save();render()}

  <div class="seg" style="margin-top:10px">${tabs.map(([k,l])=>`<button class="${leagueTab===k&&!selTeam?"on":""}" onclick="leagueTab='${k}';selTeam=null;render()">${l}</button>`).join("")}</div></div>${body}`}
function vLeagueTeam(L,t){const ms=L.matches.filter(m=>m.home===t.id||m.away===t.id).sort((a,b)=>(a.j||0)-(b.j||0)||(a.date||"").localeCompare(b.date||""));
  const st=standings(L);const pos=st.findIndex(r=>r.t.id===t.id);const r=st[pos];
  return `<div class="card"><div class="row" style="margin-bottom:10px">${crest(t,64)}<div class="grow"><h2 style="margin:0">${esc(t.name)}${t.mine?" ⭐":""}</h2>
  <div class="row" style="margin-top:6px"><label class="btn sec small" style="margin:0;color:var(--text)">🛡️ Subir escudo<input type="file" accept="image/*" hidden onchange="setLogo('${t.id}',this)"></label><button class="btn sec small" onclick="setLogoUrl('${t.id}')">🔗 Desde enlace</button>${t.logo?`<button class="btn danger small" onclick="lg().teams.find(x=>x.id==='${t.id}').logo='';save();render()">Quitar</button>`:""}</div></div></div><div class="kpis"><div class="kpi"><b>${pos+1}º</b><small>posición</small></div><div class="kpi"><b>${r.pts}</b><small>puntos</small></div><div class="kpi"><b>${r.pg}-${r.pp}</b><small>ganados-perdidos</small></div></div>
  ${r.pf?`<p class="muted">Puntos a favor ${r.pf} · en contra ${r.pc}</p>`:""}</div>
  ${rosterCard(L,t)}
  <div class="card"><h3>Partidos</h3>${ms.length?`<ul class="list">${ms.map(m=>matchLi(L,m,t.id)).join("")}</ul>`:'<div class="muted">Sin partidos.</div>'}</div>`}
function matchLi(L,m,focus){const r=setsOf(m);const won=r&&focus&&(m.home===focus||m.away===focus)?((m.home===focus)===(r.h>r.a)):null;
  return `<li><div class="grow"><div class="muted" style="font-size:.78rem">${m.j?"J"+m.j:""}${m.date?" · "+fmtDate(m.date):""}${m.time&&m.time!=="00:00"?" "+m.time:""}${m.venue?" · "+esc(m.venue):""}${m.postponed?' · <b style="color:var(--bad)">Aplazado</b>':""}</div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${crest(L.teams.find(t=>t.id===m.home)||{name:"?"},20)}${esc(tname(L,m.home))} <b>${r?r.h+" - "+r.a:"vs"}</b> ${esc(tname(L,m.away))}${crest(L.teams.find(t=>t.id===m.away)||{name:"?"},20)}</div>${r&&r.detail?`<div class="muted" style="font-size:.78rem">${m.sets.map(s=>s.join("-")).join(" · ")}</div>`:""}</div>
  ${won===null?"":`<span class="pill ${won?"ok":"bad"}">${won?"G":"P"}</span>`}<button class="btn sec small" onclick="editMatch('${m.id}')">✎</button></li>`}
function vLeagueMatches(L){const js=[...new Set(L.matches.map(m=>m.j||0))].sort((a,b)=>a-b);
  const opts=L.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");

   <input name="res" placeholder="Resultado: 3-1  o sets: 25-20 23-25 25-18 25-21 (vacío = pendiente)" style="margin-top:8px">
   <div class="row" style="margin-top:8px"><button class="btn small">Guardar</button>${L.teams.length>=3&&!L.matches.length?`<button type="button" class="btn sec small" onclick="genCalendar()">Generar calendario ida y vuelta</button>`:""}</div></form></div>`:""}
  <details class="card"><summary><b>📋 Pegar resultados</b></summary><p class="muted">Copia los resultados de la web de la federación y pégalos aquí, uno por línea. Ejemplos:<br>J5 Élite Voley El Rosario 3-0 CV Extintores Astro Yejarafe<br>CD Taknara 2 - 3 CV La Victoria<br>Los equipos que no existan se crean solos.</p>

function parseRes(txt){txt=(txt||"").trim();if(!txt)return {};const sets=[...txt.matchAll(/(\d{1,2})\s*[-–]\s*(\d{1,2})/g)].map(m=>[+m[1],+m[2]]);
  if(sets.length===1&&sets[0][0]<=3&&sets[0][1]<=3)return {hs:sets[0][0],as:sets[0][1],sets:[]};
  if(sets.length)return {sets};return null}
function addMatch(e){e.preventDefault();const f=e.target;const L=lg();if(f.home.value===f.away.value){alert("Elige dos equipos distintos");return}

function editMatch(id){const L=lg();const m=L.matches.find(x=>x.id===id);const d=$("#dlg");const cur=m.sets&&m.sets.length?m.sets.map(s=>s.join("-")).join(" "):(m.hs!=null?m.hs+"-"+m.as:"");
