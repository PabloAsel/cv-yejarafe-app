  <label>Resultado (3-1 o sets 25-20 23-25 …; vacío = pendiente)</label><input name="res" value="${esc(cur)}">
  <div style="max-height:50vh;overflow:auto">${statsInputs(L,m)}</div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><button type="button" class="btn danger" onclick="delMatch('${id}')">Eliminar</button><div class="row"><button value="cancel" class="btn sec">Cancelar</button><button value="ok" class="btn">Guardar</button></div></div></form>`;
  d.showModal();d.onclose=()=>{if(d.returnValue!=="ok")return;const f=$("#em");const r=parseRes(f.res.value);if(r===null){alert("Resultado no válido");return}
    delete m.hs;delete m.as;m.sets=[];Object.assign(m,{j:+f.j.value||0,date:f.date.value},r);readStats(f,m);save();render()}}
function delMatch(id){if(!confirm("¿Eliminar este partido?"))return;const L=lg();L.matches=L.matches.filter(m=>m.id!==id);save();$("#dlg").close();render()}
function findOrAddTeam(L,name){name=name.trim();const n=norm(name);let t=L.teams.find(x=>norm(x.name)===n)||L.teams.find(x=>norm(x.name).includes(n)||n.includes(norm(x.name)));
  if(!t){t={id:uid(),name,mine:/yejarafe/i.test(name)};L.teams.push(t)}return t}
function pasteResults(){const L=lg();let n=0,bad=[];$("#pasteRes").value.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
  let j=0;const jm=l.match(/^(?:J(?:ornada)?\.?\s*)(\d+)[\s:.-]+/i);if(jm){j=+jm[1];l=l.slice(jm[0].length)}
  const m=l.match(/^(.+?)\s+(\d)\s*[-–]\s*(\d)\s+(.+?)(?:\s+\(([^)]*)\))?$/);if(!m){bad.push(l);return}
  const h=findOrAddTeam(L,m[1]),a=findOrAddTeam(L,m[4]);const sets=m[5]?[...m[5].matchAll(/(\d{1,2})\s*[-–]\s*(\d{1,2})/g)].map(x=>[+x[1],+x[2]]):[];
  L.matches.push(sets.length?{id:uid(),j,date:"",home:h.id,away:a.id,sets}:{id:uid(),j,date:"",home:h.id,away:a.id,hs:+m[2],as:+m[3],sets:[]});n++});
  save();render();toast(n+" resultados añadidos");if(bad.length)alert("No he entendido estas líneas:\n"+bad.join("\n"))}
function vLeagueTeams(L){return `<div class="card"><h3>Equipos (${L.teams.length})</h3>
  ${L.teams.length?`<ul class="list">${L.teams.map(t=>`<li>${crest(t,32)}<div class="grow click" onclick="selTeam='${t.id}';render();scrollTo(0,0)">${esc(t.name)}<div class="muted">${(t.players||[]).length} jugadores ›</div></div><button class="chip ${t.mine?"si":""}" onclick="toggleMine('${t.id}')">${t.mine?"⭐ Nuestro":"Marcar como nuestro"}</button><button class="btn danger small" onclick="delTeam('${t.id}')">✕</button></li>`).join("")}</ul>`:'<div class="muted">Aún no hay equipos.</div>'}

function delLeague(){if(!confirm("¿Eliminar esta liga con todos sus resultados?"))return;db.leagues=db.leagues.filter(l=>l.id!==selLeague);selLeague=null;save();render()}
function genCalendar(){const L=lg();const ids=L.teams.map(t=>t.id);if(ids.length%2)ids.push(null);const n=ids.length,rounds=n-1;let arr=[...ids];const first=[];
  for(let r=0;r<rounds;r++){for(let i=0;i<n/2;i++){const h=arr[i],a=arr[n-1-i];if(h&&a)first.push({j:r+1,home:r%2?a:h,away:r%2?h:a})}arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  const all=[...first,...first.map(m=>({j:m.j+rounds,home:m.away,away:m.home}))];all.forEach(m=>L.matches.push({id:uid(),date:"",sets:[],...m}));save();render();toast(all.length+" partidos creados (sin fecha)")}

const LPOS=["Colocador","Opuesto","Receptor","Central","Líbero","Otro"];
function lpStats(L,t){const pl=t.players||[];const S={};pl.forEach(p=>S[p.id]={p,pj:0,A:0,B:0,S:0,E:0});
  L.matches.forEach(m=>{if(!m.stats)return;Object.entries(m.stats).forEach(([pid,v])=>{const r=S[pid];if(!r)return;r.pj++;["A","B","S","E"].forEach(k=>r[k]+=(+v[k]||0))})});
  return Object.values(S).map(r=>({...r,pts:r.A+r.B+r.S})).sort((a,b)=>b.pts-a.pts||(+a.p.num||99)-(+b.p.num||99))}
function rosterCard(L,t){const rows=lpStats(L,t);

function lvParseMatches(L,doc){const inc={};(doc.included||[]).forEach(x=>inc[x.type+":"+x.id]=x);const get=(r)=>r&&r.data?inc[r.data.type+":"+r.data.id]:null;

      const ps=(m.relationships.periods&&m.relationships.periods.data||[]).map(p=>inc["period:"+p.id]).filter(Boolean).sort((p,q)=>p.attributes.order-q.attributes.order);
      ps.forEach(p=>{const rr=(p.relationships.results.data||[]).map(r=>inc["result:"+r.id]).filter(Boolean);

const REC51={1:{1:[8.4,5.4],2:[7,4.6],3:[3.5,1],4:[1.2,1],5:[1.8,5.6],6:[4.6,5.9]},
  2:{1:[7.2,5.9],2:[7.8,.9],3:[5.2,.8],4:[1.4,4.6],5:[4.2,5.9],6:[5.6,1.8]},
  3:{1:[7.4,6],2:[8.2,.8],3:[2.2,4.8],4:[.9,.8],5:[1.6,1.6],6:[4.8,6]},
  4:{1:[8.4,5.6],2:[7.2,4.6],3:[4.6,.9],4:[3.6,.6],5:[1.6,5.8],6:[4.4,6]},
  5:{1:[7.2,6],2:[7.8,.9],3:[5.6,.6],4:[1.4,4.6],5:[4,6],6:[5.8,1.8]},
  6:{1:[7.4,6],2:[8.2,.6],3:[2.2,4.6],4:[1,.9],5:[.9,2.2],6:[4.8,6]}};
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genRec(type,r){if(type==="5-1")return JSON.parse(JSON.stringify(REC51[r]));
  const ro=rolesAt(type,r);const R=rng(r*97+type.length*13);const passers=[1,2,3,4,5,6].filter(n=>ro[n]==="OH"||ro[n]==="L");
  const lanes=[[1.6,0],[4.5,0],[7.3,0]];const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];let best=null,bc=1e9;
  for(let k=0;k<6000;k++){const pm=perms[k%6];const T={};
    passers.forEach((n,i)=>T[n]=[lanes[pm[i]][0],FRONT.includes(n)?4.6:6]);
    [1,2,3,4,5,6].forEach(n=>{if(T[n])return;const x=ro[n];
      T[n]=x==="MB"?[4.5,.8]:x==="S"?(FRONT.includes(n)?[6,.7]:[6.4,1.8]):x==="OPP"?(FRONT.includes(n)?[7.8,.8]:[8.2,7.4]):[4.5,4]});
    const s=k<6?0:Math.min(2.2,.4+k/1500);const F={};let c=0;
    for(let n=1;n<=6;n++){const t=T[n];const p=[Math.max(.4,Math.min(8.6,t[0]+(R()-.5)*2*s)),Math.max(.4,Math.min(8.6,t[1]+(R()-.5)*2*s))];F[n]=p.map(v=>Math.round(v*10)/10);
      c+=((p[0]-t[0])**2+(p[1]-t[1])**2)*(ro[n]==="S"?2:passers.includes(n)?1.5:1)}
    if(legal(F,.3)&&c<bc){bc=c;best=F}}
  return best||defaultForm("rec")}
function genBase(type,r){const ro=rolesAt(type,r);const f={};
  [1,2,3,4,5,6].forEach(n=>{const x=ro[n],fr=FRONT.includes(n);f[n]=fr?(x==="MB"?[4.5,1]:x==="OH"?[1.4,1]:[7.6,1]):(x==="L"?[4.5,8]:x==="OH"?[1.6,7]:[7.4,7])});return f}
function defaultForm(phase){const f={};for(let n=1;n<=6;n++)f[n]=[...HZ[n]];
  if(phase==="rec"){f[1]=[7.3,6.3];f[5]=[1.7,6.3];f[6]=[4.5,6.8];f[2]=[8,2.2];f[3]=[4.5,1.6];f[4]=[1,2.2]}
  if(phase==="serve"){f[2]=[7.5,1];f[3]=[4.5,1];f[4]=[1.5,1];f[1]=[8.2,9.8];f[5]=[1.6,6.2];f[6]=[4.5,6.6]}
  if(phase==="base"){f[2]=[7.8,.9];f[3]=[4.5,.9];f[4]=[1.2,.9];f[1]=[7.6,7.4];f[6]=[4.5,8.2];f[5]=[1.4,7.4]}
  return f}

function overlapFaults(f){const x=n=>f[n][0],y=n=>f[n][1];const out=[];
  if(!(x(4)<x(3)))out.push("4 y 3");if(!(x(3)<x(2)))out.push("3 y 2");if(!(x(5)<x(6)))out.push("5 y 6");if(!(x(6)<x(1)))out.push("6 y 1");
  if(!(y(4)<y(5)))out.push("4 y 5");if(!(y(3)<y(6)))out.push("3 y 6");if(!(y(2)<y(1)))out.push("2 y 1");return out}

function autoLineup(type){const ps=sortedPlayers().filter(p=>!p.demo||db.players.every(x=>x.demo));const by=k=>ps.filter(p=>p.pos===k);
  const pool={S:by("Colocador"),OH:by("Receptor"),MB:by("Central"),OPP:by("Opuesto")};const used=new Set();
  const take=k=>{let p=(pool[k]||[]).find(x=>!used.has(x.id));if(!p&&k==="OPP")p=pool.OH.find(x=>!used.has(x.id))||pool.S.find(x=>!used.has(x.id));if(!p)p=ps.find(x=>!used.has(x.id)&&x.pos!=="Líbero");if(p)used.add(p.id);return p?p.id:null};
  const seq=(ROLE_SEQ[type]||ROLE_SEQ["5-1"]).map(k=>type==="5-1"||k!=="S"?k:"S");db.lineup.slots=seq.map(take);
  const lib=by("Líbero").find(x=>!used.has(x.id));db.lineup.libero=lib?lib.id:db.lineup.libero;save();render();toast("Alineación ordenada para el "+type)}

function bindSystems(){const svg=$("#ssvg");if(!svg)return;const S=db.systems.find(s=>s.id===selSystem);

    document.querySelectorAll("#ssvg [data-pos]").forEach(g=>{const n=+g.dataset.pos;const a=from[n],z=to[n];g.setAttribute("transform",`translate(${a[0]+(z[0]-a[0])*e} ${a[1]+(z[1]-a[1])*e})`)});

let pushT=null,busy=false;
function syncDot(){const el=$("#syncDot");if(!el)return;el.textContent=!sync.url?"":busy?"⟳ guardando":sync.err?"⚠️ sin conexión":sync.dirty?"● pendiente":"☁️ ok"}
function schedulePush(){clearTimeout(pushT);pushT=setTimeout(push,1500);syncDot()}
function syncKey(){if(!sync.k){sync.k=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>"abcdefghijkmnopqrstuvwxyz23456789"[b%33]).join("");saveSyncState()}return sync.k}
async function api(body){const u=sync.url+(sync.url.includes("?")?"&":"?")+"k="+encodeURIComponent(syncKey());const r=await fetch(body?sync.url:u,body?{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,k:syncKey()})}:{});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();if(j&&j.error==="clave"){sync.keyErr=true;throw new Error("clave")}sync.keyErr=false;return j}
function mergeArr(remote,local,isSession){const m=new Map((remote||[]).map(x=>[x.id,x]));
  (local||[]).forEach(x=>{const r=m.get(x.id);
    if(isSession&&r){const rt=r.rsvpT||{},lt=x.rsvpT||{};const rs={...(x.rsvp||{})};Object.keys({...(r.rsvp||{}),...rt}).forEach(k=>{if((rt[k]||0)>(lt[k]||0)){if(r.rsvp&&r.rsvp[k])rs[k]=r.rsvp[k];else delete rs[k]}});
      const T={...lt};Object.keys(rt).forEach(k=>{if((rt[k]||0)>(T[k]||0))T[k]=rt[k]});const W={...(r.well||{})};Object.entries(x.well||{}).forEach(([k,v])=>{if(!W[k]||(v.t||0)>=(W[k].t||0))W[k]=v});m.set(x.id,{...x,rsvp:rs,rsvpT:T,well:W})}
    else m.set(x.id,x)});return [...m.values()]}
function merge(remote,local){const out=Object.assign(blank(),remote);["players","videos","exercises","notes","fees","money","lineups","tests","leagues","plays","systems","teams"].forEach(k=>out[k]=mergeArr(remote[k],local[k]));out.sessions=mergeArr(remote.sessions,local.sessions,true);out.team=local.team||remote.team;out.rivals={...(remote.rivals||{})};Object.entries(local.rivals||{}).forEach(([k,v])=>{if(!out.rivals[k]||(v.at||0)>=(out.rivals[k].at||0))out.rivals[k]=v});out.lineup=local.lineup||remote.lineup;return out}
async function push(){if(!sync.url||busy)return;busy=true;syncDot();const td=today();db.sessions.forEach(x=>{if(x.type==="partido"&&x.date>=addDays(td,-1)&&x.date<=addDays(td,1)&&evs(x).length){const L=liveOf(x);const o=x.live;if(!o||JSON.stringify({...o,at:0})!==JSON.stringify({...L,at:0}))x.live=L}});
  try{let res=await api({a:"save",base:sync.base,db});
    if(res.conflict){setRoot(merge(res.db,raw()));db.updatedAt=Date.now();persist();res=await api({a:"save",base:res.db.updatedAt,db});if(!document.querySelector("dialog[open]"))keepScroll(()=>{})}
    if(!res.ok)throw new Error(res.error||"error");
    sync.base=db.updatedAt;sync.dirty=false;sync.err=false;sync.last=Date.now()}
  catch(e){sync.err=true}
  busy=false;saveSyncState();syncDot()}
async function pull(manual){if(!sync.url||busy)return;if(sync.dirty)await push();
  busy=true;syncDot();
  try{const res=await api();
    if(res.db&&res.db.updatedAt){if(res.db.updatedAt!==db.updatedAt&&!sync.dirty){setRoot(Object.assign(blank(),res.db));persist();if(!document.querySelector("dialog[open]"))keepScroll(()=>{})}sync.base=res.db.updatedAt}
    sync.err=false;sync.last=Date.now();if(manual)toast("Sincronizado")}
  catch(e){sync.err=true;if(manual)toast("No se pudo conectar con la hoja")}
  busy=false;saveSyncState();syncDot()}
async function connect(url){url=(url||"").trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){alert("La dirección debe empezar por https://script.google.com/");return}
  sync.url=url;busy=true;syncDot();
  try{const res=await api();busy=false;
    if(res.db&&res.db.players&&res.db.players.length){if(db.players.length&&db.players.every(p=>p.demo)){setRoot(Object.assign(blank(),res.db));persist();sync.base=res.db.updatedAt;sync.dirty=false}else if(db.players.length&&!confirm("La hoja ya tiene datos. ¿Combinarlos con los de este móvil? (Cancelar = usar solo los de la hoja)")){setRoot(Object.assign(blank(),res.db));persist();sync.base=res.db.updatedAt;sync.dirty=false}else{setRoot(merge(res.db,raw()));db.updatedAt=Date.now();persist();sync.base=res.db.updatedAt;sync.dirty=true}}
    else{sync.base=res.db?res.db.updatedAt||0:0;sync.dirty=true;if(!db.updatedAt)db.updatedAt=Date.now()}
    saveSyncState();if(sync.dirty)await push();
    toast(sync.err?"Conectado, pero no se pudo guardar":"¡Conectado a la hoja de Google!")}
  catch(e){busy=false;sync.url="";alert(String(e.message)==="clave"?"Esta hoja ya está protegida con la clave del equipo. Pide al entrenador principal el “Enlace para otro entrenador” desde su app (Más › Datos y Google).":"No se pudo conectar. Revisa que la aplicación web esté implementada con acceso “Cualquier usuario”.")}
  saveSyncState();render()}
function disconnect(){if(!confirm("¿Desconectar este móvil de la hoja? Los datos se quedan en el móvil y en la hoja."))return;sync={url:"",base:0,dirty:false,k:sync.k};saveSyncState();render()}

  const app=$("#app");app.innerHTML=`<div class="card empty">Cargando…</div>`;
  let data=null;try{const j=await pubGet(url,"pub",sid);if(j.ok)data={team:j.team,players:j.players,sessions:[j.session]}}catch(e){}
  const s=data&&data.sessions.find(x=>x.id===sid);
  if(!s){app.innerHTML=`<div class="card empty">No se ha encontrado este evento. Pide a tu entrenador un enlace nuevo.</div>`;return}
  $("#teamTitle").textContent="🏐 "+data.team;
  const ps=[...data.players].sort((a,b)=>(+a.number||999)-(+b.number||999));
  let me=null;try{me=localStorage.getItem("voleibol-me")}catch(e){}
  const draw=msg=>{app.innerHTML=`<div class="card"><h2>${s.type==="partido"?"🏆 Partido":"🏋️ Entreno"} · ${fmtDate(s.date)}${s.time?" "+s.time:""}</h2>${s.title?`<div>${esc(s.title)}</div>`:""}${s.place?`<div class="muted">📍 ${esc(s.place)}</div>`:""}</div>
   <div class="card"><label>¿Quién eres?</label><select id="me"><option value="">Elige tu nombre…</option>${ps.map(p=>`<option value="${p.id}" ${p.id===me?"selected":""}>${esc(p.number)} ${esc(p.name)}</option>`).join("")}</select>
   <div class="row" style="margin-top:12px"><button class="btn grow" style="background:var(--ok)" onclick="rsvpSend('si')">👍 Voy</button><button class="btn grow" style="background:var(--bad)" onclick="rsvpSend('no')">👎 No voy</button><button class="btn grow" style="background:var(--warn)" onclick="rsvpSend('duda')">🤔 Duda</button></div>
   ${msg?`<p style="margin-bottom:0"><b>${msg}</b></p>`:""}</div>`};
  window.rsvpSend=async v=>{const pid=$("#me").value;if(!pid){alert("Elige tu nombre");return}me=pid;try{localStorage.setItem("voleibol-me",pid)}catch(e){}
    draw("Enviando…");try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:"rsvp",sid,pid,v})});const j=await r.json();if(!j.ok)throw 0;draw("✅ ¡Gracias! Respuesta guardada: "+RSVP[v])}catch(e){draw("⚠️ No se pudo enviar. Inténtalo de nuevo.")}};
  draw();
}

/* ---------- arranque ---------- */
const QP=new URLSearchParams(location.search);
if(QP.get("c")&&QP.get("s")){confirmPage(QP.get("c"),QP.get("s"))}
else if(QP.get("w")&&QP.get("s")){wellPage(QP.get("w"),QP.get("s"))}
else if(QP.get("live")&&QP.get("s")){livePage(QP.get("live"),QP.get("s"))}
else{
  let seeded=null;try{seeded=localStorage.getItem("voleibol-seeded")}catch(e){}
  if(!db.players.length&&!seeded&&!QP.get("sync"))loadDemo(true);
  else if(db.players.some(p=>p.demo)&&!(db.tests||[]).some(x=>x.demo)){demoTests(db.players.filter(p=>p.demo));persist()}
  render();
  if(QP.get("sync")&&!sync.url){const u=QP.get("sync");if(QP.get("k")){sync.k=QP.get("k");saveSyncState()}try{history.replaceState(null,"",appUrl())}catch(e){}if(confirm("¿Conectar esta app a la hoja de Google del equipo?"))connect(u)}
  else if(sync.url)pull(false);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&sync.url)pull(false)});
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
